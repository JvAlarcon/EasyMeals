spring.application.name=easymeals-orders
spring.config.import=optional:file:.env[.properties]

# --------------------------------
# PostgreSQL configuration
# --------------------------------
spring.datasource.url=jdbc:postgresql://${PSQL_HOST:localhost}:${PSQL_PORT:5432}/easymeals?currentSchema=ms_orders
spring.datasource.username=${PSQL_USER}
spring.datasource.password=${PSQL_PASSWORD}
spring.datasource.driver-class.name=org.postgresql.Driver

# --------------------------------
# Message bundle
# --------------------------------
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# --------------------------------
# Test logs
# --------------------------------
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE

# --------------------------------
# Eureka
# --------------------------------
eureka.client.service-url.defaultZone=http://localhost:9310/eureka/

# -----------------------------------------------------
# To prevent showing error messages from spring boot
# -----------------------------------------------------
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never